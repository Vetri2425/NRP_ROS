<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NRP Rover — AsyncAPI Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/@asyncapi/react-component@latest/styles/default.min.css">
  <style>
    body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: Arial, Helvetica, sans-serif; }
    #loading { text-align: center; padding: 4rem; color: #94a3b8; font-size: 1.1rem; }
    #error { color: #f87171; padding: 2rem; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <div id="loading">Loading AsyncAPI documentation...</div>
  <div id="error"></div>
  <div id="asyncapi"></div>

  <script src="https://unpkg.com/@asyncapi/react-component@latest/browser/standalone/index.js"></script>
  <script>
    fetch('/api/docs/asyncapi.yaml')
      .then(function(r) { return r.text(); })
      .then(function(schema) {
        document.getElementById('loading').style.display = 'none';
        AsyncApiStandalone.render(
          { schema: schema, config: { show: { sidebar: true, errors: true } } },
          document.getElementById('asyncapi')
        );
      })
      .catch(function(err) {
        document.getElementById('loading').style.display = 'none';
        var el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent = 'Failed to load AsyncAPI spec:\n' + err;
      });
  </script>
</body>
</html>
